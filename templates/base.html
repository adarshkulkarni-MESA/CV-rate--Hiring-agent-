<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Kargo Hiring Agent{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #5b8cff;
      --accent-soft: rgba(91,140,255,0.12);
      --green: #34d399;
      --green-soft: rgba(52,211,153,0.12);
      --red: #f87171;
      --red-soft: rgba(248,113,113,0.12);
      --muted: #6b7280;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --radius: 10px;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.6; min-height: 100vh; }

    /* NAV */
    nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; height: 56px; gap: 24px; }
    .nav-brand { font-weight: 700; font-size: 16px; color: var(--text); text-decoration: none; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
    .nav-brand span { color: var(--accent); }
    nav a { color: var(--text-dim); text-decoration: none; font-size: 13px; font-weight: 500; padding: 4px 8px; border-radius: 6px; transition: all 0.15s; }
    nav a:hover, nav a.active { color: var(--text); background: var(--surface2); }
    .nav-spacer { flex: 1; }

    /* MAIN LAYOUT */
    main { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
    .subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 28px; }

    /* CARDS */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .card + .card { margin-top: 16px; }

    /* BADGE */
    .badge { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .badge-interview { background: var(--green-soft); color: var(--green); }
    .badge-reject { background: var(--red-soft); color: var(--red); }
    .badge-pm { background: var(--accent-soft); color: var(--accent); }
    .badge-spm { background: rgba(167,139,250,0.12); color: #a78bfa; }

    /* SCORE BAR */
    .score-row { display: flex; align-items: center; gap: 10px; }
    .score-num { font-size: 20px; font-weight: 700; min-width: 36px; }
    .score-bar-bg { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
    .score-bar-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.4s ease; }

    /* BUTTONS */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; text-decoration: none; transition: all 0.15s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #4b7cf3; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .btn-success { background: var(--green); color: #0f2e22; }
    .btn-success:hover { background: #22c07a; }
    .btn-danger { background: var(--red); color: #3b0707; }
    .btn-sm { padding: 5px 12px; font-size: 12px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* FORM */
    label { display: block; font-size: 12px; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; letter-spacing: 0.04em; text-transform: uppercase; }
    input[type=file], select { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; color: var(--text); padding: 10px 12px; font-size: 13px; font-family: inherit; }
    input[type=file]:focus, select:focus { outline: none; border-color: var(--accent); }
    select option { background: var(--surface2); }
    .form-row { display: grid; grid-template-columns: 1fr 160px; gap: 12px; align-items: end; }

    /* TABLE */
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 11px; font-weight: 600; color: var(--text-dim); letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 12px; border-bottom: 1px solid var(--border); }
    td { padding: 12px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    .candidate-link { color: var(--text); text-decoration: none; font-weight: 500; }
    .candidate-link:hover { color: var(--accent); }

    /* DIM GRID */
    .dim-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .dim-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .dim-label { font-size: 11px; font-weight: 600; color: var(--text-dim); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
    .dim-score { font-size: 24px; font-weight: 700; }
    .dim-evidence { font-size: 12px; color: var(--text-dim); margin-top: 4px; line-height: 1.5; }

    /* PROSE */
    .prose { color: var(--text-dim); font-size: 13px; line-height: 1.7; }
    .prose h2 { color: var(--text); font-size: 15px; font-weight: 600; margin: 20px 0 8px; }
    .prose ul { padding-left: 18px; }
    .prose li { margin-bottom: 4px; }
    .prose pre { background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 14px; white-space: pre-wrap; font-family: monospace; font-size: 12px; line-height: 1.6; }

    /* FLASH */
    .flash { padding: 12px 16px; border-radius: 7px; margin-bottom: 20px; font-size: 13px; }
    .flash-success { background: var(--green-soft); color: var(--green); border: 1px solid rgba(52,211,153,0.25); }
    .flash-error { background: var(--red-soft); color: var(--red); border: 1px solid rgba(248,113,113,0.25); }
    .flash-info { background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(91,140,255,0.25); }

    /* DRAG DROP */
    .drop-zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 32px; text-align: center; color: var(--muted); cursor: pointer; transition: all 0.2s; }
    .drop-zone.drag-over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .drop-zone p { margin-top: 8px; font-size: 12px; }

    /* SPINNER */
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* MODAL OVERLAY */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px; max-width: 440px; width: 90%; }
    .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
    .modal p { color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

    /* UTIL */
    .flex { display: flex; }
    .items-center { align-items: center; }
    .gap-10 { gap: 10px; }
    .gap-16 { gap: 16px; }
    .mt-4 { margin-top: 4px; }
    .mt-8 { margin-top: 8px; }
    .mt-16 { margin-top: 16px; }
    .mt-24 { margin-top: 24px; }
    .ml-auto { margin-left: auto; }
    .text-muted { color: var(--text-dim); }
    .text-sm { font-size: 12px; }
    .font-mono { font-family: monospace; }
    .section-title { font-size: 13px; font-weight: 600; color: var(--text-dim); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 12px; }
    .empty-state { text-align: center; padding: 48px 24px; color: var(--text-dim); }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
    .tag-sent { display: inline-block; font-size: 10px; font-weight: 600; color: var(--green); background: var(--green-soft); border-radius: 4px; padding: 1px 6px; margin-left: 6px; }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-brand">⚡ Kargo <span>Hiring</span></a>
  <a href="/" {% if request.path == '/' %}class="active"{% endif %}>Dashboard</a>
  <a href="/score" {% if request.path == '/score' %}class="active"{% endif %}>Score CV</a>
  <div class="nav-spacer"></div>
  <span class="text-muted text-sm" style="font-size:11px;">Powered by Gemini 3.8 Flash</span>
</nav>

<main>
  {% with msgs = get_flashed_messages(with_categories=True) %}
    {% for cat, msg in msgs %}
      <div class="flash flash-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>

{% block scripts %}{% endblock %}
</body>
</html>
